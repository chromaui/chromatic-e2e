name: Setup Playwright
description: Setup and cache Playwright browser binaries

inputs:
  install-deps:
    description: Install system dependencies of all Playwright browsers. Downloaded apt packages are cached.
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve package versions
      id: resolve-package-versions
      shell: bash
      run: >
        echo "$(
          node -e "
            const fs = require('fs');
            const lockfile = fs.readFileSync('./pnpm-lock.yaml', 'utf8');
            const pattern = (name) => new RegExp(name + ':\\\s+specifier: [\\\s\\\w\\\.^]+version: (\\\d+\\\.\\\d+\\\.\\\d+)');
            const playwrightVersion = lockfile.match(pattern('playwright'))[1];
            console.log('PLAYWRIGHT_VERSION=' + playwrightVersion);
          "
        )" >> $GITHUB_OUTPUT &&
        echo "IMAGE_OS=$ImageOS" >> $GITHUB_OUTPUT

    - name: Check resolved package versions
      shell: bash
      if: |
        contains(fromJSON('[null, "", "undefined"]'), steps.resolve-package-versions.outputs.PLAYWRIGHT_VERSION)
      run: echo "Failed to resolve package versions. See log above." && exit 1

    - name: Cache Playwright v${{ steps.resolve-package-versions.outputs.PLAYWRIGHT_VERSION }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: playwright-cache
      with:
        path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
        key: ${{ runner.os }}-playwright-${{ steps.resolve-package-versions.outputs.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Dependencies
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm exec playwright install

    # System dependencies cannot be cached, but the downloaded .deb archives can.
    # This avoids depending on the speed of the Ubuntu package mirror.
    - name: Cache apt archives for Playwright system dependencies
      if: inputs.install-deps == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/apt-archives
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-package-versions.outputs.IMAGE_OS }}-playwright-apt-${{ steps.resolve-package-versions.outputs.PLAYWRIGHT_VERSION }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve-package-versions.outputs.IMAGE_OS }}-playwright-apt-

    - name: Install Playwright System Dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: |
        ARCHIVES="$HOME/.cache/apt-archives"
        mkdir -p "$ARCHIVES/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$ARCHIVES\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'APT::Sandbox::User "root";' \
          | sudo tee /etc/apt/apt.conf.d/99-playwright-apt-cache
        pnpm exec playwright install-deps
        # Drop packages that are no longer downloadable, and make archives readable for cache save
        sudo apt-get autoclean
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
